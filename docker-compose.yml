version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: paytm_postgres
    restart: always
    environment:
      POSTGRES_DB: seat_reservation_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U app_user -d  seat_reservation_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  paytmreservationsystem:
    image: paytmreservationsystem
    build:
      context: .
      dockerfile: src/PaytmReservationSystem/Dockerfile
  
volumes:
  pgdata:

